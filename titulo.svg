<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Los Caballeros del Zodiaco: práctica de clases en Python" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b24"/>
      <stop offset="1" stop-color="#1a1048"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="recorte">
      <text x="400" y="100" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="46" textLength="700" lengthAdjust="spacingAndGlyphs">LOS CABALLEROS DEL ZODIACO</text>
    </clipPath>
  </defs>
  <style>
    .estrella { animation: parpadeo 2.5s ease-in-out infinite; }
    .e2 { animation-delay: 0.6s; }
    .e3 { animation-delay: 1.2s; }
    .e4 { animation-delay: 1.8s; }
    @keyframes parpadeo { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
    .barrido { animation: pasar 3.5s linear infinite; }
    @keyframes pasar { from { transform: translateX(-200px); } to { transform: translateX(800px); } }
  </style>
  <rect width="800" height="200" rx="12" fill="url(#fondo)"/>
  <g fill="#ffffff">
    <circle class="estrella" cx="60" cy="40" r="2"/>
    <circle class="estrella e2" cx="150" cy="150" r="1.5"/>
    <circle class="estrella e3" cx="260" cy="30" r="1.8"/>
    <circle class="estrella e4" cx="360" cy="170" r="1.5"/>
    <circle class="estrella e2" cx="470" cy="28" r="2"/>
    <circle class="estrella" cx="560" cy="160" r="1.6"/>
    <circle class="estrella e3" cx="660" cy="45" r="1.8"/>
    <circle class="estrella e4" cx="740" cy="140" r="2"/>
    <circle class="estrella e2" cx="30" cy="120" r="1.4"/>
    <circle class="estrella e3" cx="770" cy="30" r="1.4"/>
  </g>
  <text x="400" y="100" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="46" font-weight="900" textLength="700" lengthAdjust="spacingAndGlyphs" fill="url(#oro)" stroke="#6b4a00" stroke-width="1.5">LOS CABALLEROS DEL ZODIACO</text>
  <g clip-path="url(#recorte)">
    <rect class="barrido" x="0" y="50" width="120" height="70" fill="url(#brillo)"/>
  </g>
  <text x="400" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="3" fill="#cfd6ff">Práctica de clases en Python</text>
</svg>
